name: shangwu-suanliang cross-platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Setup deps (cad-file-reader)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input -q openpyxl
          git clone --depth 1 --branch v0.32.1 https://github.com/lisong2003-lgtm/cad-file-reader ../cad-file-reader
          # 强制用本平台 PyPI 二进制重建 vendor（Release 包内自带 macOS _core.abi3.so，跨平台不可用）
          # 先清掉仓库自带的不兼容 vendor，setup.py --force 只重装并不清旧文件
          python - <<'PY2'
          from pathlib import Path
          import shutil
          v = Path('../cad-file-reader/vendor')
          if v.exists():
              shutil.rmtree(v, ignore_errors=True)
              print('cleared cad-file-reader/vendor')
          PY2
          python ../cad-file-reader/scripts/setup.py --force

      - name: unittest discover（320 tests, 含真实 CLI 中文 JSON）
        shell: bash
        env:
          CAD_SKILL_DIR: ../cad-file-reader
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          base = Path('scripts')
          root = Path('.').resolve()
          sys.path.insert(0, str(root))
          sys.path.insert(0, str(base))
          sys.path.insert(0, str(Path('../cad-file-reader/scripts').resolve()))
          import unittest
          suite = unittest.defaultTestLoader.discover('scripts/tests')
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
          python scripts/smoke_utf8_json.py
      - name: i18n 英文 smoke（--lang en JSON 可读）
        run: python scripts/smoke_utf8_json.py --lang en

      - name: Windows 中文 JSON 输出验证
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/smoke_utf8_json.py
